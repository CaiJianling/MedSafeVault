<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef3f9" />
    <title>MedSafeVault 更新服务 · 管理后台</title>
    <script>
      // 亮暗跟随上次的选择，没选过就跟随系统；和桌面端用同一个 localStorage 键名。
      ;(function () {
        var root = document.documentElement
        var theme = 'system'
        try {
          theme = localStorage.getItem('heroui-theme') || 'system'
        } catch (error) {}
        var dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var resolved = dark ? 'dark' : 'light'
        root.classList.add(resolved)
        root.setAttribute('data-theme', resolved)
        root.style.colorScheme = resolved
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#090d13' : '#eef3f9')
      })()
    </script>
    <style>html,body{background:#eef3f9;min-height:100%;margin:0}html.dark,html.dark body{background:#090d13}.boot-splash{color:#5d6f85;letter-spacing:.08em;justify-content:center;align-items:center;gap:14px;min-height:100vh;font:13px/1.4 Microsoft YaHei UI,Segoe UI,system-ui,sans-serif;display:flex}html.dark .boot-splash{color:#8b9bad}.boot-mark{background:linear-gradient(145deg,#60a5fa,#1d4ed8);border-radius:11px;width:34px;height:34px;animation:1.6s ease-in-out infinite boot-pulse;box-shadow:0 8px 24px -10px #2563ebbf}@keyframes boot-pulse{50%{opacity:.55;transform:scale(.94)}}</style>
    <script type="module" crossorigin src="./assets/index-CdT7Sol_.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-CykD5yQ8.css">
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div class="boot-mark"></div>
        <span>更新服务正在载入…</span>
      </div>
    </div>
  </body>
</html>
